name: Create quarterly feature branches

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Quarterly branch (e.g. 2025Q4)'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.quarter }}
  cancel-in-progress: true

jobs:
  create-features:
    runs-on:
      group: triton
      labels: [self-hosted, APP]

    strategy:
      fail-fast: false
      matrix:
        feature:
          - macos
          - miscfix
          - pbulk
          - pbulkmulti
          - performance

    steps:
      # Self-hosted runners keep the workspace between jobs. Clear anything
      # an earlier run (including a cancelled or conflicted one) left behind
      # that would break the git steps below.
      - name: Reset workspace left by previous runs
        run: |
          [ -d .git ] || exit 0
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git remote remove netbsd 2>/dev/null || true
          rm -rf .git/modules extra joyent wip

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure github-actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch NetBSD/pkgsrc.git
        run: |
          git remote add netbsd https://github.com/NetBSD/pkgsrc.git
          git fetch netbsd

      - name: Create feature/${{ matrix.feature }}/${{ inputs.quarter }}
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          git checkout -B feature/${{ matrix.feature }}/"$QUARTER" origin/feature/${{ matrix.feature }}/trunk
          git rebase --committer-date-is-author-date --onto netbsd/pkgsrc-"$QUARTER" netbsd/trunk

      - name: Push feature/${{ matrix.feature }}/${{ inputs.quarter }}
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          git push --force origin feature/${{ matrix.feature }}/"$QUARTER"
